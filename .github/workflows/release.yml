name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.2"

      - run: opam install -y dune

      - run: opam exec -- dune build

      - name: Stage Windows binaries
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          mkdir -p dist
          cp _build/default/server.exe dist/server.exe
          cp _build/default/send.exe   dist/send.exe

      - name: Upload Windows binaries
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: windows-binaries
          path: dist/*.exe

      - name: Stage Linux binaries
        if: matrix.os == 'ubuntu-latest'
        run: |
          mkdir -p dist
          cp _build/default/server.exe dist/server-linux-x86_64
          cp _build/default/send.exe   dist/send-linux-x86_64

      - name: Upload Linux binaries
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: linux-binaries
          path: dist/*

      - name: Stage macOS binaries
        if: matrix.os == 'macos-latest'
        run: |
          mkdir -p dist
          cp _build/default/server.exe dist/server-macos-arm64
          cp _build/default/send.exe   dist/send-macos-arm64

      - name: Upload macOS binaries
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: macos-binaries
          path: dist/*

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-binaries
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: linux-binaries
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: macos-binaries
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
